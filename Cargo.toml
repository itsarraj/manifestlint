[package]
name = "manifestlint"
version = "0.1.0"
edition = "2021"
description = "Lints Cargo or Node.js manifests for missing required fields across a monorepo"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/manifestlint"
readme = "README.md"
keywords = ["lint", "manifest", "cli"]
categories = ["command-line-utilities"]

[dependencies]
toml = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
ignore = "0.4"
